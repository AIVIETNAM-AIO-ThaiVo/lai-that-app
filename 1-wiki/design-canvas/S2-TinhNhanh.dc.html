<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tính lãi và giá</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A7A6B}a:hover{color:#075E52}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; color: #12161C; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

<div style="flex: 1; padding: 44px 20px 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Tính lãi</h1>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CFD8; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #12161C">Shopee · Shop thường
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12161C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>

<div role="tablist" aria-label="Cách tính" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #E8EBEF">
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #12161C; box-shadow: 0 1px 2px rgba(18,22,28,0.12)">Từ giá bán</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3A424E">Từ % lãi muốn có</button>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #5B6472">Ngành hàng
<button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CFD8; background: #FFFFFF; font: inherit; color: #12161C; text-align: left">
<span style="font-size: 16px; font-weight: 500">Sở thích &amp; Sưu tầm</span>
<span style="font-size: 15px; font-weight: 600; color: #3A424E">16% ›</span>
</button>
</label>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #5B6472">Giá vốn
<span style="display: flex; align-items: center; height: 48px; border: 1px solid #C9CFD8; background: #FFFFFF; border-radius: 12px; padding: 0 12px; gap: 6px">
<input type="text" value="8.000" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; color: #12161C; background: transparent">
<span style="font-size: 15px; color: #5B6472">đ</span>
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #5B6472">Giá bán
<span style="display: flex; align-items: center; height: 48px; border: 1.5px solid #12161C; background: #FFFFFF; border-radius: 12px; padding: 0 12px; gap: 6px">
<input type="text" value="17.000" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; color: #12161C; background: transparent">
<span style="font-size: 15px; color: #5B6472">đ</span>
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #5B6472">Mã giảm giá shop
<span style="display: flex; align-items: center; height: 48px; border: 1px solid #C9CFD8; background: #FFFFFF; border-radius: 12px; padding: 0 6px 0 12px; gap: 6px">
<input type="text" value="0" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; color: #12161C; background: transparent">
<button type="button" aria-label="Đổi giữa đồng và phần trăm" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 0; background: #E8EBEF; font: inherit; font-size: 13px; font-weight: 700; color: #12161C">đ | %</button>
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #5B6472">Ship người mua trả
<span style="display: flex; align-items: center; height: 48px; border: 1px solid #C9CFD8; background: #FFFFFF; border-radius: 12px; padding: 0 12px; gap: 6px">
<input type="text" value="0" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; color: #12161C; background: transparent">
<span style="font-size: 15px; color: #5B6472">đ</span>
</span>
</label>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px dashed #9AA3AF; background: transparent; font: inherit; font-size: 14px; color: #12161C">
<span style="font-weight: 600">Chi phí khác: đóng gói 1.500đ</span>
<span style="font-weight: 600; color: {{accent}}">+ Hoàn hàng, ads</span>
</button>

<div style="display: flex; gap: 8px">
<a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9CFD8; color: #12161C; text-decoration: none; font-size: 14px; font-weight: 600">Xem từng khoản phí</a>
<button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #12161C; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Lưu sản phẩm</button>
</div>

<p style="margin: 0; font-size: 11px; line-height: 1.45; color: #5B6472">Biểu phí Shopee cập nhật 12/11/2026 · ước tính độc lập, không liên kết với sàn</p>
</div>

<section aria-label="Kết quả" style="margin: 0 12px 10px; border-radius: 18px; background: #FBF1DE; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 -2px 12px rgba(18,22,28,0.08)">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #3A424E">Lãi mỗi đơn</span>
<span style="font-size: 13px; color: #3A424E">Hòa vốn ở <b style="color: #12161C">16.340đ</b></span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 40px; font-weight: 700; line-height: 1.05; color: {{thin}}">505đ</span>
<span style="font-size: 15px; font-weight: 600; color: {{thin}}">Lãi mỏng · 3,0%</span>
</div>
<div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px" aria-label="Tiền đi đâu: sàn và thuế 41%, chi phí của bạn 56%, lãi 3%">
<span style="width: 41%; background: #7C8696"></span><span style="width: 56%; background: #B4BCC7"></span><span style="width: 3%; background: {{thin}}"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #3A424E"><span>Sàn + thuế 41%</span><span>Vốn + gói 56%</span><span>Lãi 3%</span></div>
</section>

<nav style="display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; background: #FFFFFF; border-top: 1px solid #E3E6EB" aria-label="Điều hướng chính">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M8 6h8"></path><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"></path></svg>Tính</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16v-5M12 16V8M17 16v-3"></path></svg>So sánh</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="m3 8 9 5 9-5M12 13v8"></path></svg>Sản phẩm</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6472; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Cài đặt</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0A7A6B"},"thin":{"editor":"color","default":"#A16207"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0A7A6B', thin: this.props.thin ?? '#A16207' };
}
}
</script>
</body>
</html>
