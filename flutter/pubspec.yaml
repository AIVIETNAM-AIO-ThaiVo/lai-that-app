name: lai_that
description: "Lãi Thật: Tính Phí Sàn TMĐT — tính lãi thật sau phí Shopee, TikTok Shop, Lazada."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1          # Be Vietnam Pro
  intl: ^0.19.0
  sqflite: ^2.4.1               # danh mục sản phẩm, lưu trên máy
  path: ^1.9.0
  shared_preferences: ^2.3.3    # nhớ sàn/ngành/ship lần trước
  firebase_core: ^3.8.0
  firebase_remote_config: ^5.1.5   # fee_presets, fee_version, pro_prices
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  google_mobile_ads: ^5.2.0     # kèm UMP consent
  in_app_purchase: ^3.2.0       # Pro tháng/năm, dùng thử 3 ngày
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2           # kiểm tra biểu phí mới mỗi ngày

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fee_presets.json
